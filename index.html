<!-- ক্লাসের সময় (১.৫ ঘণ্টার শিফট) -->
<div class="p-5 rounded-2xl bg-blue-50/70 border border-blue-200 space-y-4">
    <label class="block text-xs font-black text-blue-900 uppercase tracking-wide flex items-center gap-2">
        <i class="fa-regular fa-clock text-blue-600"></i> ক্লাসের ফ্রি সময় (প্রতিদিন ১.৫ ঘণ্টার শিফট নির্বাচন করুন) *
    </label>

    <!-- Morning Shift -->
    <div>
        <span class="text-xs font-bold text-amber-600 block mb-2"><i class="fa-solid fa-sun"></i> সকালের শিফট:</span>
        <div class="grid grid-cols-2 gap-3 text-xs chip-option">
            <div>
                <input type="radio" name="batch_slot" id="slot_m1" value="Morning 7:00 AM - 8:30 AM" required>
                <label for="slot_m1" class="block text-center py-3.5 px-3 rounded-xl bg-white border border-slate-300 cursor-pointer font-bold transition-all text-slate-700 hover:border-blue-500">
                    সকাল ৭:০০ - ৮:৩০
                </label>
            </div>
            <div>
                <input type="radio" name="batch_slot" id="slot_m2" value="Morning 8:00 AM - 9:30 AM">
                <label for="slot_m2" class="block text-center py-3.5 px-3 rounded-xl bg-white border border-slate-300 cursor-pointer font-bold transition-all text-slate-700 hover:border-blue-500">
                    সকাল ৮:০০ - ৯:৩০
                </label>
            </div>
        </div>
    </div>

    <!-- Evening Shift -->
    <div>
        <span class="text-xs font-bold text-blue-800 block mb-2"><i class="fa-solid fa-moon"></i> বিকাল ও সান্ধ্য শিফট:</span>
        <div class="grid grid-cols-3 gap-2.5 text-xs chip-option">
            <div>
                <input type="radio" name="batch_slot" id="slot_e1" value="Evening 4:30 PM - 6:00 PM">
                <label for="slot_e1" class="block text-center py-3 px-2 rounded-xl bg-white border border-slate-300 cursor-pointer font-bold transition-all text-slate-700 hover:border-blue-500">
                    বিকাল ৪:৩০ - ৬:০০
                </label>
            </div>
            <div>
                <input type="radio" name="batch_slot" id="slot_e2" value="Evening 6:00 PM - 7:30 PM">
                <label for="slot_e2" class="block text-center py-3 px-2 rounded-xl bg-white border border-slate-300 cursor-pointer font-bold transition-all text-slate-700 hover:border-blue-500">
                    সন্ধ্যা ৬:০০ - ৭:৩০
                </label>
            </div>
            <div>
                <input type="radio" name="batch_slot" id="slot_e3" value="Night 7:30 PM - 9:00 PM">
                <label for="slot_e3" class="block text-center py-3 px-2 rounded-xl bg-white border border-slate-300 cursor-pointer font-bold transition-all text-slate-700 hover:border-blue-500">
                    রাত ৭:৩০ - ৯:০০
                </label>
            </div>
        </div>
    </div>
</div>
