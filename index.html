<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skillness | Unleash Your Potential</title>
    <!-- Google Fonts & Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body {
            font-family: 'Hind Siliguri', 'Plus Jakarta Sans', sans-serif;
            background: radial-gradient(circle at top, #1e1b4b, #0f172a, #020617);
            color: #f8fafc;
            min-height: 100vh;
        }

        .brand-logo {
            transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
        }
        .brand-logo:hover {
            transform: rotateY(180deg) scale(1.05);
        }

        .glass-panel {
            background: rgba(30, 41, 59, 0.78);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .input-glow:focus {
            outline: none;
            border-color: #818cf8;
            box-shadow: 0 0 15px rgba(129, 140, 248, 0.35);
        }

        .chip-selector input[type="radio"] {
            display: none;
        }
        .chip-selector input[type="radio"]:checked + label {
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            border-color: #a5b4fc;
            color: #ffffff;
            box-shadow: 0 0 12px rgba(99, 102, 241, 0.4);
        }
    </style>
</head>
<body class="p-4 md:p-8 flex flex-col items-center justify-center">

    <!-- Top Navigation for Teachers -->
    <div class="w-full max-w-2xl flex justify-end mb-4">
        <button onclick="toggleTeacherModal(true)" class="text-xs md:text-sm font-semibold text-indigo-300 hover:text-white bg-indigo-950/60 border border-indigo-500/30 px-4 py-2 rounded-xl transition-all duration-200 flex items-center gap-2 hover:bg-indigo-900/60 shadow-sm">
            <i class="fa-solid fa-chalkboard-user"></i> শিক্ষক হিসেবে যোগ দিন (Teach With Us)
        </button>
    </div>

    <!-- Header Section -->
    <header class="text-center max-w-xl mx-auto mb-8">
        <div class="flex items-center justify-center gap-4 mb-3">
            <div class="w-14 h-14 rounded-2xl bg-gradient-to-tr from-indigo-600 via-purple-600 to-pink-500 flex items-center justify-center shadow-xl shadow-indigo-500/30 brand-logo cursor-pointer">
                <i class="fa-solid fa-graduation-cap text-2xl text-white"></i>
            </div>
            <h1 class="text-4xl md:text-5xl font-extrabold tracking-tight bg-clip-text text-transparent bg-gradient-to-r from-indigo-300 via-purple-300 to-pink-300">
                Skillness
            </h1>
        </div>

        <p class="text-indigo-200 text-sm md:text-base font-semibold tracking-wider uppercase mb-4">
            Unleash Your Potential
        </p>

        <div class="flex items-center justify-center gap-2 md:gap-3">
            <span class="px-3.5 py-1 rounded-full text-xs font-semibold bg-indigo-900/50 border border-indigo-500/30 text-indigo-300 flex items-center gap-1.5">
                <i class="fa-solid fa-book-open text-[10px]"></i> LEARN
            </span>
            <span class="px-3.5 py-1 rounded-full text-xs font-semibold bg-purple-900/50 border border-purple-500/30 text-purple-300 flex items-center gap-1.5">
                <i class="fa-solid fa-seedling text-[10px]"></i> GROW
            </span>
            <span class="px-3.5 py-1 rounded-full text-xs font-semibold bg-pink-900/50 border border-pink-500/30 text-pink-300 flex items-center gap-1.5">
                <i class="fa-solid fa-award text-[10px]"></i> LEAD
            </span>
        </div>
    </header>

    <!-- Main Card Container -->
    <main class="w-full max-w-2xl glass-panel rounded-3xl p-6 md:p-8 shadow-2xl relative">
        
        <!-- Step Progress Bar -->
        <div class="mb-6">
            <div class="flex justify-between items-center mb-2 text-xs font-bold uppercase tracking-wider text-slate-400">
                <span id="stepIndicatorText">ধাপ ১: প্রাথমিক তথ্য ও শিফট</span>
                <span id="stepPercentText">৩৩% সম্পন্ন</span>
            </div>
            <div class="w-full h-2 bg-slate-800 rounded-full overflow-hidden">
                <div id="progressBar" class="h-full bg-gradient-to-r from-indigo-500 to-purple-500 w-1/3 transition-all duration-300"></div>
            </div>
        </div>

        <!-- Student Registration Form -->
        <form id="studentRegistrationForm" class="space-y-6">
            
            <!-- ================= STEP 1: Basic & Shift ================= -->
            <div id="step1" class="space-y-5">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-300 mb-1.5">শিক্ষার্থীর পুরো নাম *</label>
                        <input type="text" id="student_name" required placeholder="উদা: ফখরা আজম" class="w-full px-4 py-3 rounded-xl bg-slate-800/80 border border-slate-700 text-slate-100 text-sm input-glow">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-300 mb-1.5">মোবাইল নম্বর *</label>
                        <input type="tel" id="student_phone" required placeholder="017xxxxxxxx" class="w-full px-4 py-3 rounded-xl bg-slate-800/80 border border-slate-700 text-slate-100 text-sm input-glow">
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-300 mb-1.5">বর্তমান শ্রেণি *</label>
                        <select id="student_class" required class="w-full px-4 py-3 rounded-xl bg-slate-800/80 border border-slate-700 text-slate-100 text-sm input-glow">
                            <option value="">শ্রেণি নির্বাচন করুন</option>
                            <option value="Class 5">Class 5</option>
                            <option value="Class 6">Class 6</option>
                            <option value="Class 7">Class 7</option>
                            <option value="Class 8">Class 8</option>
                            <option value="Class 9">Class 9</option>
                            <option value="Class 10">Class 10</option>
                            <option value="HSC 1st/2nd Year">HSC (একাদশ/দ্বাদশ)</option>
                            <option value="Undergraduate/Other">বিশ্ববিদ্যালয় / অন্যান্য</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-300 mb-1.5">জন্ম তারিখ *</label>
                        <input type="date" id="student_dob" required class="w-full px-4 py-3 rounded-xl bg-slate-800/80 border border-slate-700 text-slate-100 text-sm input-glow">
                    </div>
                </div>

                <!-- Shift Selector -->
                <div class="p-4 rounded-2xl bg-slate-900/60 border border-slate-700/60 space-y-3">
                    <label class="block text-xs font-bold text-indigo-300 uppercase tracking-wide">
                        <i class="fa-regular fa-clock"></i> ক্লাসের ফ্রি সময় (শিফট নির্বাচন করুন) *
                    </label>

                    <div>
                        <span class="text-[11px] font-semibold text-amber-300 block mb-2"><i class="fa-solid fa-sun"></i> সকালের ব্যাচ:</span>
                        <div class="grid grid-cols-2 gap-2 text-xs chip-selector">
                            <div>
                                <input type="radio" name="batch_slot" id="slot_m1" value="Morning 7:00 AM" required>
                                <label for="slot_m1" class="block text-center py-2.5 px-3 rounded-xl bg-slate-800 border border-slate-700 cursor-pointer font-semibold transition-all">সকাল ৭:০০ টা</label>
                            </div>
                            <div>
                                <input type="radio" name="batch_slot" id="slot_m2" value="Morning 8:00 AM">
                                <label for="slot_m2" class="block text-center py-2.5 px-3 rounded-xl bg-slate-800 border border-slate-700 cursor-pointer font-semibold transition-all">সকাল ৮:০০ টা</label>
                            </div>
                        </div>
                    </div>

                    <div>
                        <span class="text-[11px] font-semibold text-indigo-300 block mb-2"><i class="fa-solid fa-moon"></i> বিকাল ও সান্ধ্য ব্যাচ:</span>
                        <div class="grid grid-cols-3 gap-2 text-xs chip-selector">
                            <div>
                                <input type="radio" name="batch_slot" id="slot_e1" value="Evening 4:00 PM">
                                <label for="slot_e1" class="block text-center py-2.5 px-2 rounded-xl bg-slate-800 border border-slate-700 cursor-pointer font-semibold transition-all">বিকাল ৪:০০</label>
                            </div>
                            <div>
                                <input type="radio" name="batch_slot" id="slot_e2" value="Evening 5:00 PM">
                                <label for="slot_e2" class="block text-center py-2.5 px-2 rounded-xl bg-slate-800 border border-slate-700 cursor-pointer font-semibold transition-all">বিকাল ৫:০০</label>
                            </div>
                            <div>
                                <input type="radio" name="batch_slot" id="slot_e3" value="Evening 6:00 PM">
                                <label for="slot_e3" class="block text-center py-2.5 px-2 rounded-xl bg-slate-800 border border-slate-700 cursor-pointer font-semibold transition-all">সন্ধ্যা ৬:০০</label>
                            </div>
                            <div>
                                <input type="radio" name="batch_slot" id="slot_n1" value="Night 7:00 PM">
                                <label for="slot_n1" class="block text-center py-2.5 px-2 rounded-xl bg-slate-800 border border-slate-700 cursor-pointer font-semibold transition-all">সন্ধ্যা ৭:০০</label>
                            </div>
                            <div>
                                <input type="radio" name="batch_slot" id="slot_n2" value="Night 8:00 PM">
                                <label for="slot_n2" class="block text-center py-2.5 px-2 rounded-xl bg-slate-800 border border-slate-700 cursor-pointer font-semibold transition-all">রাত ৮:০০</label>
                            </div>
                            <div>
                                <input type="radio" name="batch_slot" id="slot_n3" value="Night 9:00 PM">
                                <label for="slot_n3" class="block text-center py-2.5 px-2 rounded-xl bg-slate-800 border border-slate-700 cursor-pointer font-semibold transition-all">রাত ৯:০০</label>
                            </div>
                        </div>
                    </div>
                </div>

                <button type="button" onclick="goToStep(2)" class="w-full py-3.5 rounded-xl font-bold text-sm bg-gradient-to-r from-indigo-600 to-purple-600 hover:opacity-95 text-white shadow-lg transition-all flex items-center justify-center gap-2">
                    পরবর্তী ধাপে যান <i class="fa-solid fa-arrow-right"></i>
                </button>
            </div>

            <!-- ================= STEP 2: Background & Vision ================= -->
            <div id="step2" class="space-y-5 hidden">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-300 mb-1.5">বাবার নাম *</label>
                        <input type="text" id="father_name" placeholder="বাবার পুরো নাম" class="w-full px-4 py-3 rounded-xl bg-slate-800/80 border border-slate-700 text-slate-100 text-sm input-glow">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-300 mb-1.5">অভিভাবকের মোবাইল নম্বর *</label>
                        <input type="tel" id="guardian_phone" placeholder="018xxxxxxxx" class="w-full px-4 py-3 rounded-xl bg-slate-800/80 border border-slate-700 text-slate-100 text-sm input-glow">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1.5">পূর্ণ ঠিকানা (গ্রাম/রোড, থানা, জেলা) *</label>
                    <textarea id="student_address" rows="2" placeholder="আপনার বিস্তারিত স্থায়ী ঠিকানা..." class="w-full px-4 py-3 rounded-xl bg-slate-800/80 border border-slate-700 text-slate-100 text-sm input-glow"></textarea>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-300 mb-1.5">ভবিষ্যতে কী হতে চাও? (Aim in Life) *</label>
                        <input type="text" id="student_aim" placeholder="উদা: সফটওয়্যার ইঞ্জিনিয়ার, ডাক্তার..." class="w-full px-4 py-3 rounded-xl bg-slate-800/80 border border-slate-700 text-slate-100 text-sm input-glow">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-300 mb-1.5">অবসরে কী করতে ভালোবাসো? (Hobby) *</label>
                        <input type="text" id="student_hobby" placeholder="উদা: বই পড়া, কোডিং, অঙ্ক করা..." class="w-full px-4 py-3 rounded-xl bg-slate-800/80 border border-slate-700 text-slate-100 text-sm input-glow">
                    </div>
                </div>

                <div class="flex gap-3 pt-2">
                    <button type="button" onclick="goToStep(1)" class="w-1/3 py-3.5 rounded-xl font-bold text-sm bg-slate-800 hover:bg-slate-700 text-slate-300 transition-all flex items-center justify-center gap-2">
                        <i class="fa-solid fa-arrow-left"></i> পূর্ববর্তী
                    </button>
                    <button type="button" onclick="goToStep(3)" class="w-2/3 py-3.5 rounded-xl font-bold text-sm bg-gradient-to-r from-indigo-600 to-purple-600 hover:opacity-95 text-white shadow-lg transition-all flex items-center justify-center gap-2">
                        পোশাক ও সম্মতি ধাপ <i class="fa-solid fa-arrow-right"></i>
                    </button>
                </div>
            </div>

            <!-- ================= STEP 3: Logistics & Media Consent ================= -->
            <div id="step3" class="space-y-5 hidden">
                
                <!-- Clothing / T-Shirt Size -->
                <div class="p-4 rounded-2xl bg-slate-900/60 border border-slate-700/60 space-y-3">
                    <label class="block text-xs font-bold text-indigo-300 uppercase tracking-wide flex items-center gap-2">
                        <i class="fa-solid fa-shirt"></i> অফিসিয়াল টি-শার্ট / পোশাকের সাইজ নির্বাচন করুন *
                    </label>
                    <div class="grid grid-cols-5 gap-2 text-xs chip-selector">
                        <div>
                            <input type="radio" name="cloth_size" id="size_s" value="S" required>
                            <label for="size_s" class="block text-center py-2.5 rounded-xl bg-slate-800 border border-slate-700 cursor-pointer font-bold transition-all">S</label>
                        </div>
                        <div>
                            <input type="radio" name="cloth_size" id="size_m" value="M">
                            <label for="size_m" class="block text-center py-2.5 rounded-xl bg-slate-800 border border-slate-700 cursor-pointer font-bold transition-all">M</label>
                        </div>
                        <div>
                            <input type="radio" name="cloth_size" id="size_l" value="L">
                            <label for="size_l" class="block text-center py-2.5 rounded-xl bg-slate-800 border border-slate-700 cursor-pointer font-bold transition-all">L</label>
                        </div>
                        <div>
                            <input type="radio" name="cloth_size" id="size_xl" value="XL">
                            <label for="size_xl" class="block text-center py-2.5 rounded-xl bg-slate-800 border border-slate-700 cursor-pointer font-bold transition-all">XL</label>
                        </div>
                        <div>
                            <input type="radio" name="cloth_size" id="size_xxl" value="XXL">
                            <label for="size_xxl" class="block text-center py-2.5 rounded-xl bg-slate-800 border border-slate-700 cursor-pointer font-bold transition-all">XXL</label>
                        </div>
                    </div>
                </div>

                <!-- Legal Media Release Consent -->
                <div class="p-4 rounded-2xl bg-indigo-950/40 border border-indigo-500/30 space-y-2">
                    <label class="flex items-start gap-3 cursor-pointer">
                        <input type="checkbox" id="student_media_consent" required class="mt-1 w-4 h-4 rounded text-indigo-600 focus:ring-indigo-500 border-slate-600 bg-slate-800">
                        <span class="text-xs text-slate-300 leading-relaxed">
                            <b class="text-indigo-300 font-semibold">সোশ্যাল মিডিয়া ও ভিডিও প্রকাশ সংক্রান্ত সম্মতি:</b> আমি ও আমার অভিভাবক সম্মতি প্রদান করছি যে, Skillness প্ল্যাটফর্মের ক্লাস কার্যক্রম, প্রেজেন্টেশন এবং প্রমোশনাল ভিডিও/ছবি প্রতিষ্ঠানের অফিসিয়াল ফেসবুক পেজ ও সোশ্যাল মিডিয়ায় শিক্ষামূলক প্রচারণায় প্রকাশ করা হতে পারে। *
                        </span>
                    </label>
                </div>

                <div class="flex gap-3 pt-2">
                    <button type="button" onclick="goToStep(2)" class="w-1/3 py-3.5 rounded-xl font-bold text-sm bg-slate-800 hover:bg-slate-700 text-slate-300 transition-all flex items-center justify-center gap-2">
                        <i class="fa-solid fa-arrow-left"></i> পূর্ববর্তী
                    </button>
                    <button type="submit" class="w-2/3 py-3.5 rounded-xl font-extrabold text-sm bg-gradient-to-r from-indigo-500 via-purple-500 to-pink-500 hover:opacity-95 text-white shadow-lg transition-all flex items-center justify-center gap-2">
                        <i class="fa-solid fa-check"></i> সম্পূর্ণ রেজিস্ট্রেশন সম্পন্ন করুন
                    </button>
                </div>
            </div>

        </form>
    </main>

    <!-- ================= TEACHER APPLICATION MODAL ================= -->
    <div id="teacherModal" class="fixed inset-0 bg-slate-950/85 backdrop-blur-sm flex items-center justify-center p-4 z-50 hidden">
        <div class="w-full max-w-xl glass-panel rounded-3xl p-6 md:p-8 relative max-h-[90vh] overflow-y-auto">
            <button onclick="toggleTeacherModal(false)" class="absolute top-5 right-5 text-slate-400 hover:text-white transition-colors">
                <i class="fa-solid fa-xmark text-xl"></i>
            </button>
            
            <h3 class="text-xl font-bold text-indigo-300 mb-1 flex items-center gap-2">
                <i class="fa-solid fa-chalkboard-user"></i> শিক্ষক হিসেবে আবেদন করুন
            </h3>
            <p class="text-xs text-slate-400 mb-5">Skillness টিমে যোগ দিয়ে তরুণদের মেধা বিকাশে ভূমিকা রাখুন</p>

            <form id="teacherApplicationForm" class="space-y-4">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-300 mb-1.5">শিক্ষকের পুরো নাম *</label>
                        <input type="text" required placeholder="আপনার নাম" class="w-full px-3.5 py-2.5 rounded-xl bg-slate-800/90 border border-slate-700 text-sm text-white input-glow">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-300 mb-1.5">জন্ম তারিখ *</label>
                        <input type="date" required class="w-full px-3.5 py-2.5 rounded-xl bg-slate-800/90 border border-slate-700 text-sm text-white input-glow">
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-300 mb-1.5">ফোন নম্বর *</label>
                        <input type="tel" required placeholder="017xxxxxxxx" class="w-full px-3.5 py-2.5 rounded-xl bg-slate-800/90 border border-slate-700 text-sm text-white input-glow">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-300 mb-1.5">ইমেইল অ্যাড্রেস *</label>
                        <input type="email" required placeholder="name@example.com" class="w-full px-3.5 py-2.5 rounded-xl bg-slate-800/90 border border-slate-700 text-sm text-white input-glow">
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold text-slate-300 mb-1.5">সর্বোচ্চ শিক্ষাগত যোগ্যতা *</label>
                        <input type="text" required placeholder="B.Sc / Masters in CSE/English" class="w-full px-3.5 py-2.5 rounded-xl bg-slate-800/90 border border-slate-700 text-sm text-white input-glow">
                    </div>
                    <div>
                        <label class="block text-xs font-semibold text-slate-300 mb-1.5">কোন বিষয়ে পড়াতে আগ্রহী? *</label>
                        <input type="text" required placeholder="Spoken English, ICT, Coding" class="w-full px-3.5 py-2.5 rounded-xl bg-slate-800/90 border border-slate-700 text-sm text-white input-glow">
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1.5">পূর্ণ ঠিকানা *</label>
                    <textarea rows="2" required placeholder="আপনার পূর্ণ ঠিকানা..." class="w-full px-3.5 py-2.5 rounded-xl bg-slate-800/90 border border-slate-700 text-sm text-white input-glow"></textarea>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1.5">পড়াতে কেন ভালোবাসেন? *</label>
                    <textarea rows="2" required placeholder="শিক্ষকতার প্রতি আপনার প্যাশন ও আগ্রহ লিখুন..." class="w-full px-3.5 py-2.5 rounded-xl bg-slate-800/90 border border-slate-700 text-sm text-white input-glow"></textarea>
                </div>

                <div>
                    <label class="block text-xs font-semibold text-slate-300 mb-1.5">ভবিষ্যত ক্যারিয়ার লক্ষ্য (Vision) *</label>
                    <input type="text" required placeholder="উদা: এডুকেশন ট্রেইনার হওয়া, সফটওয়্যার লিড হওয়া..." class="w-full px-3.5 py-2.5 rounded-xl bg-slate-800/90 border border-slate-700 text-sm text-white input-glow">
                </div>

                <!-- Teacher Media Consent -->
                <div class="p-3 rounded-xl bg-purple-950/40 border border-purple-500/30">
                    <label class="flex items-start gap-2.5 cursor-pointer">
                        <input type="checkbox" required class="mt-1 w-4 h-4 rounded text-purple-600 focus:ring-purple-500 border-slate-600 bg-slate-800">
                        <span class="text-xs text-slate-300 leading-relaxed">
                            <b class="text-purple-300 font-semibold">মিডিয়া সম্মতি:</b> আমি সম্মতি দিচ্ছি যে আমার পরিচালিত ক্লাস সেশন, ডেমো বা প্রেজেন্টেশনের ভিডিও Skillness-এর অফিসিয়াল ফেসবুক পেজ ও ব্র্যান্ডিং প্ল্যাটফর্মে প্রকাশ করা যাবে। *
                        </span>
                    </label>
                </div>

                <button type="submit" class="w-full py-3.5 rounded-xl font-extrabold text-sm bg-gradient-to-r from-purple-600 via-pink-600 to-indigo-600 hover:opacity-95 text-white shadow-lg transition-all flex items-center justify-center gap-2">
                    <i class="fa-solid fa-paper-plane"></i> আবেদন ও সম্মতি জমা দিন
                </button>
            </form>
        </div>
    </div>

    <!-- Script Logic -->
    <script>
        function goToStep(step) {
            const step1 = document.getElementById('step1');
            const step2 = document.getElementById('step2');
            const step3 = document.getElementById('step3');
            const bar = document.getElementById('progressBar');
            const stepText = document.getElementById('stepIndicatorText');
            const percentText = document.getElementById('stepPercentText');

            if (step === 2) {
                const name = document.getElementById('student_name').value.trim();
                const phone = document.getElementById('student_phone').value.trim();
                const studentClass = document.getElementById('student_class').value;
                const dob = document.getElementById('student_dob').value;
                const slot = document.querySelector('input[name="batch_slot"]:checked');

                if (!name || !phone || !studentClass || !dob || !slot) {
                    alert('অনুগ্রহ করে ধাপ ১-এর সকল প্রয়োজনীয় তথ্য ও ক্লাসের শিফট নির্বাচন করুন।');
                    return;
                }

                step1.classList.add('hidden');
                step3.classList.add('hidden');
                step2.classList.remove('hidden');
                bar.style.width = '66%';
                stepText.innerText = 'ধাপ ২: পারিবারিক ও লক্ষ্য';
                percentText.innerText = '৬৬% সম্পন্ন';
            } else if (step === 3) {
                const father = document.getElementById('father_name').value.trim();
                const gPhone = document.getElementById('guardian_phone').value.trim();
                const address = document.getElementById('student_address').value.trim();
                const aim = document.getElementById('student_aim').value.trim();
                const hobby = document.getElementById('student_hobby').value.trim();

                if (!father || !gPhone || !address || !aim || !hobby) {
                    alert('অনুগ্রহ করে ধাপ ২-এর সকল তথ্য পূরণ করুন।');
                    return;
                }

                step1.classList.add('hidden');
                step2.classList.add('hidden');
                step3.classList.remove('hidden');
                bar.style.width = '100%';
                stepText.innerText = 'ধাপ ৩: পোশাক ও মিডিয়া সম্মতি';
                percentText.innerText = '১০০% সম্পন্ন';
            } else {
                step2.classList.add('hidden');
                step3.classList.add('hidden');
                step1.classList.remove('hidden');
                bar.style.width = '33%';
                stepText.innerText = 'ধাপ ১: প্রাথমিক তথ্য ও শিফট';
                percentText.innerText = '৩৩% সম্পন্ন';
            }
        }

        function toggleTeacherModal(show) {
            const modal = document.getElementById('teacherModal');
            if (show) modal.classList.remove('hidden');
            else modal.classList.add('hidden');
        }

        document.getElementById('studentRegistrationForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const size = document.querySelector('input[name="cloth_size"]:checked');
            const consent = document.getElementById('student_media_consent').checked;

            if (!size) {
                alert('অনুগ্রহ করে পোশাকের সাইজ নির্বাচন করুন।');
                return;
            }
            if (!consent) {
                alert('সোশ্যাল মিডিয়া ভিডিও সম্মতি বক্সে টিক চিহ্ন দিন।');
                return;
            }

            alert('অভিনন্দন! আপনার আবেদন ও মিডিয়া সম্মতি সফলভাবে গৃহীত হয়েছে।');
        });

        document.getElementById('teacherApplicationForm').addEventListener('submit', function(e) {
            e.preventDefault();
            alert('ধন্যবাদ! শিক্ষক হিসেবে আপনার আবেদন ও সম্মতি সফলভাবে রেকর্ড করা হয়েছে।');
            toggleTeacherModal(false);
        });
    </script>
</body>
</html>
